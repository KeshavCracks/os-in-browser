name: Remote Desktop
run-name: ${{ inputs.os }}

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

on:
  workflow_dispatch:
    inputs:
      os:
        description: Operating system
        type: choice
        required: true
        default: windows-latest
        options:
          - windows-latest
          - ubuntu-latest
          - macos-latest

      username:
        description: Username
        type: string
        required: true

      password:
        description: Password
        type: string
        required: true

jobs:
  job:
    name: URL
    runs-on: ${{ inputs.os }}

    environment:
      name: ${{ github.run_id }}

    permissions:
      contents: read
      deployments: write

    env:
      PORT: 8080
      GITHUB_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start tunnel
        id: tunnel
        env:
          METRICS_URL: "localhost:8081"
        run: |
          case "$RUNNER_OS" in
            Windows)
              CLOUDFLARED=./cloudflared.exe

              curl -fsSL \
                "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe" \
                -o "${CLOUDFLARED}"
              ;;

            Linux)
              CLOUDFLARED=./cloudflared

              curl -fsSL \
                "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64" \
                -o "${CLOUDFLARED}"
              ;;

            macOS)
              CLOUDFLARED=./cloudflared

              curl -fsSL \
                "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-darwin-arm64.tgz" |
                tar -xz
              ;;
          esac

          chmod +x "${CLOUDFLARED}"

          "${CLOUDFLARED}" tunnel \
            --metrics="${METRICS_URL}" \
            --url "http://localhost:${PORT}" &

          until JSON="$(curl -sS "${METRICS_URL}/quicktunnel")"; do
            sleep 0.1
          done

          HOSTNAME="$(jq -r '.hostname' <<< "${JSON}")"
          TUNNEL_URL="https://${HOSTNAME}"

          echo "url=${TUNNEL_URL}" >> "$GITHUB_OUTPUT"

      - name: Setup Ubuntu desktop and audio
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /var/lib/apt/lists/*
          sudo apt-get clean
          sudo apt-get update

          sudo apt-get install -y --no-install-recommends \
            icewm \
            xvfb \
            libx11-6 \
            libxtst6 \
            libxfixes3 \
            pulseaudio \
            pulseaudio-utils

          read -r DISPLAY_NUMBER < <(
            Xvfb \
              -displayfd 1 \
              -screen 0 1920x1080x24 \
              +extension XTEST \
              +extension XFIXES \
              -nolisten tcp
          )

          export DISPLAY=":$DISPLAY_NUMBER"
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"

          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"

          echo "DISPLAY=$DISPLAY" >> "$GITHUB_ENV"
          echo "XDG_RUNTIME_DIR=$XDG_RUNTIME_DIR" >> "$GITHUB_ENV"

          pulseaudio --start --exit-idle-time=-1

          pactl load-module module-null-sink \
            sink_name=remote_desktop \
            sink_properties=device.description=RemoteDesktop

          pactl set-default-sink remote_desktop

          echo "=== PulseAudio ==="
          pactl info

          echo "=== Sinks ==="
          pactl list short sinks

          echo "=== Sources ==="
          pactl list short sources

          icewm-session &

      - name: Setup Windows audio
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest `
            https://download.vb-audio.com/Download_CABLE/VBCABLE_Driver_Pack45.zip `
            -OutFile "$env:RUNNER_TEMP\VBCABLE.zip"

          Expand-Archive `
            "$env:RUNNER_TEMP\VBCABLE.zip" `
            -DestinationPath "$env:RUNNER_TEMP\VBCABLE"

          & "$env:RUNNER_TEMP\VBCABLE\VBCABLE_Setup_x64.exe" -i -h

          Start-Service audiosrv

          Install-Module AudioDeviceCmdlets -Force -Confirm:$false
          Import-Module AudioDeviceCmdlets

          $cable = Get-AudioDevice -List |
            Where-Object { $_.Name -like "CABLE Input*" } |
            Select-Object -First 1

          if (-not $cable) {
            Get-AudioDevice -List | Format-Table -AutoSize
            throw "VB-CABLE playback device not found"
          }

          Set-AudioDevice -Index $cable.Index

          Get-AudioDevice -Playback

      - name: Resolve latest release tag
        id: release
        run: |
          TAG="$(gh release view \
            --repo "$GITHUB_REPOSITORY" \
            --json tagName \
            --jq .tagName 2>/dev/null \
          || gh release view \
            --repo "kingdudely/os-in-browser" \
            --json tagName \
            --jq .tagName)"

          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Install Electron binary
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          VERSION="${RELEASE_TAG#v}"

          case "$RUNNER_OS" in
            Linux)
              ZIP_NAME="os-in-browser-linux-x64-${VERSION}.zip"
              ;;

            Windows)
              ZIP_NAME="os-in-browser-win32-x64-${VERSION}.zip"
              ;;

            macOS)
              ZIP_NAME="os-in-browser-darwin-arm64-${VERSION}.zip"
              ;;
          esac

          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "$ZIP_NAME" \
          || gh release download "$RELEASE_TAG" \
            --repo "kingdudely/os-in-browser" \
            --pattern "$ZIP_NAME"

          unzip -q "$ZIP_NAME" || {
            status=$?
            if [ "$status" -ne 1 ]; then
              exit "$status"
            fi
          }

      - name: Overlay app sources into Electron bundle
        run: |
          case "$RUNNER_OS" in
            Linux) ROOT="./os-in-browser-linux-x64" ;;
            Windows) ROOT="./os-in-browser-win32-x64" ;;
            macOS) ROOT="./os-in-browser.app/Contents" ;;
          esac

          RESOURCES="${ROOT}/resources"
          if [ ! -d "${RESOURCES}" ]; then
            echo "Electron resources not found at ${RESOURCES}"
            ls -la
            exit 1
          fi

          if [ -f "${RESOURCES}/app.asar" ]; then
            npx --yes @electron/asar extract "${RESOURCES}/app.asar" "${RESOURCES}/app"
            rm -f "${RESOURCES}/app.asar"
          fi

          DEST="${RESOURCES}/app"
          if [ -d "${DEST}/app" ]; then
            DEST="${DEST}/app"
          fi

          cp -R app/. "${DEST}/"

      - name: Run remote desktop
        env:
          TUNNEL_URL: ${{ steps.tunnel.outputs.url }}
        run: |
          export USERNAME=$(jq -r '.inputs.username // ""' "$GITHUB_EVENT_PATH")
          echo "::add-mask::${USERNAME}"

          export PASSWORD=$(jq -r '.inputs.password // ""' "$GITHUB_EVENT_PATH")
          echo "::add-mask::${PASSWORD}"

          case "$RUNNER_OS" in
            Linux)
              sudo chown root:root ./os-in-browser-linux-x64/chrome-sandbox
              sudo chmod 4755 ./os-in-browser-linux-x64/chrome-sandbox
              ./os-in-browser-linux-x64/os-in-browser --enable-features=PulseaudioLoopbackForScreenShare --disable-features=WebRtcAllowInputVolumeAdjustment

              ;;

            Windows)
              ./os-in-browser-win32-x64/os-in-browser.exe

              ;;

            macOS)
              chmod +x ./os-in-browser.app/Contents/MacOS/os-in-browser
              ./os-in-browser.app/Contents/MacOS/os-in-browser --disable-features=MacCatapLoopbackAudioForScreenShare
              ;;
          esac
